<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Urban Waste Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo" data-icon="logo"></span><span class="name">Urban Waste Intelligence</span></a>
    <nav aria-label="Planning tools">
      <a href="map.html?role=planner" data-t="signin.planner_map"></a>
      <a href="builder.html" data-t="signin.route_builder"></a>
      <a href="rules.html" data-t="signin.rules"></a>
    </nav>
  </header>

  <main class="signin">
    <p class="eyebrow" data-t="signin.eyebrow"></p>
    <h1 data-t="signin.title"></h1>

    <div id="current" class="card-box current" hidden>
      <p><span data-t="signin.signed_in_as"></span> <b id="currentName"></b> · <span id="currentRole"></span></p>
      <div class="row">
        <a id="continueBtn" class="btn block" href="#" data-t="signin.continue"></a>
        <button id="signOutBtn" type="button" class="secondary block" data-t="common.sign_out"></button>
      </div>
    </div>

    <form id="signinForm" class="card-box" novalidate>
      <fieldset class="choice-group">
        <legend data-t="signin.role"></legend>
        <div id="roleChoices" class="choices"><p class="hint" data-t="signin.loading_roles"></p></div>
      </fieldset>
      <label><span data-t="signin.name"></span><input id="name" name="name" autocomplete="name" required /></label>
      <fieldset id="sectorBox" class="choice-group" hidden>
        <legend data-t="signin.sectors"></legend>
        <div id="sectorChoices" class="chips"></div>
        <p id="assignedNote" class="hint small" data-t="signin.assigned" hidden></p>
      </fieldset>
      <label><span data-t="signin.language"></span>
        <select id="language"><option value="en" data-t="lang.en"></option><option value="kn" data-t="lang.kn"></option></select></label>
      <p id="formError" class="warn" hidden></p>
      <button type="submit" class="block lg" data-t="signin.submit"></button>
      <p class="hint small" data-t="signin.note"></p>
    </form>

    <p class="hint small" data-t="signin.footer"></p>
  </main>

  <script src="ui.js"></script>
  <script>
    const PILOT = "hsr";
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    let ROLES = [];

    function selectedRole() {
      const r = document.querySelector('input[name="role"]:checked');
      return r ? ROLES.find((x) => x.key === r.value) : null;
    }

    function updateFields() {
      const role = selectedRole();
      $("sectorBox").hidden = !role || role.jurisdiction !== "sector";
    }

    function showCurrent() {
      const s = getSession();
      const role = s && ROLES.find((x) => x.key === s.role);
      $("current").hidden = !role;
      if (!role) return;
      $("currentName").textContent = s.name;
      $("currentRole").textContent = t(`role.${role.key}`) + (s.sectors?.length ? ` · ${s.sectors.join(", ")}` : "");
      $("continueBtn").href = role.home;
    }

    // Sectors a supervisor assigned to this name are ticked (still editable: login is a dummy).
    async function preselectAssigned() {
      const name = $("name").value.trim();
      const role = selectedRole();
      if (!name || !role || role.key !== "surveyor") return;
      try {
        const { assignments } = await apiFetch(`/api/pilots/${PILOT}/assignments?surveyor=${encodeURIComponent(name)}`);
        if (!assignments.length) return;
        const sectors = new Set(assignments.map((a) => a.sector));
        document.querySelectorAll('input[name="sector"]').forEach((c) => (c.checked = sectors.has(c.value)));
        $("assignedNote").hidden = false;
      } catch { /* keep manual choice */ }
    }

    (async () => {
      await UI_READY;
      $("language").value = (getSession() || {}).language || "en";
      try {
        const [reg, sectors] = await Promise.all([apiFetch("/api/roles"), apiFetch(`/api/pilots/${PILOT}/sectors`)]);
        ROLES = reg.roles;
        $("roleChoices").innerHTML = ROLES.filter((r) => r.built).map((r) => `
          <label class="choice"><input type="radio" name="role" value="${esc(r.key)}" />
            <span><b>${esc(t(`role.${r.key}`))}</b><span class="muted small">${esc(t(`role.${r.key}.description`))}</span></span></label>`).join("");
        $("sectorChoices").innerHTML = sectors.features.map((f) => f.properties.name).map((n) => `
          <label class="chip"><input type="checkbox" name="sector" value="${esc(n)}" /><span>${esc(n)}</span></label>`).join("");
        document.querySelectorAll('input[name="role"]').forEach((el) => el.addEventListener("change", () => { updateFields(); preselectAssigned(); }));
        const s = getSession();
        if (s) {
          $("name").value = s.name || "";
          document.querySelector(`input[name="role"][value="${CSS.escape(s.role)}"]`)?.click();
          (s.sectors || []).forEach((n) => { const c = document.querySelector(`input[name="sector"][value="${CSS.escape(n)}"]`); if (c) c.checked = true; });
        }
        showCurrent();
      } catch (err) {
        $("roleChoices").innerHTML = `<p class="warn">${esc(err.message)}</p>`;
      }
    })();

    $("name").addEventListener("change", preselectAssigned);
    $("language").addEventListener("change", () => {
      const s = getSession();
      if (s) { setSession({ ...s, language: $("language").value }); applyStrings(); }
    });
    $("signinForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const role = selectedRole();
      const name = $("name").value.trim();
      const sectors = [...document.querySelectorAll('input[name="sector"]:checked')].map((c) => c.value);
      const problem = !role ? t("signin.err_role") : !name ? t("signin.err_name") : role.jurisdiction === "sector" && !sectors.length ? t("signin.err_sector") : "";
      $("formError").hidden = !problem;
      $("formError").textContent = problem;
      if (problem) return;
      setSession({ role: role.key, name, sectors: role.jurisdiction === "sector" ? sectors : [], language: $("language").value,
                   signed_in_at: new Date().toISOString() });
      location.href = role.home;
    });
    $("signOutBtn").addEventListener("click", signOut);
    $("signinForm").addEventListener("input", () => { $("formError").hidden = true; });
  </script>
</body>
</html>

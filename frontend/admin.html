<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page with-rail">
  <nav id="appNav"></nav>
  <main class="doc">
    <header class="page-head">
      <p class="eyebrow" data-t="admin.eyebrow"></p>
      <h1 data-t="admin.title"></h1>
      <p class="sub" id="who"></p>
    </header>
    <div id="denied" class="card-box" hidden>
      <p><span data-t="admin.denied"></span> <a href="index.html" data-t="admin.sign_in_as_admin"></a></p>
    </div>
    <div id="content" hidden>
      <h2 data-t="admin.users"></h2>
      <p class="hint" data-t="admin.users_note"></p>
      <h2 data-t="admin.roles"></h2>
      <p class="hint" data-t="admin.roles_note"></p>
      <div id="roleTable"></div>
      <h2 data-t="admin.coming"></h2>
      <p class="hint" data-t="admin.coming_note"></p>
      <div id="comingNext" class="roles"></div>
      <h2 data-t="admin.tools"></h2>
      <p class="hint" data-t="admin.tools_note"></p>
      <p><a href="map.html?role=planner" data-t="signin.planner_map"></a> · <a href="builder.html" data-t="signin.route_builder"></a> · <a href="rules.html" data-t="signin.rules"></a></p>
    </div>
  </main>
  <script src="ui.js"></script>
  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    (async () => {
      await UI_READY;
      const s = getSession();
      if (!s || s.role !== "admin") {
        document.getElementById("denied").hidden = false;
        return;
      }
      document.getElementById("who").textContent = t("admin.signed_in", { name: s.name });
      document.getElementById("content").hidden = false;
      try {
        const reg = await apiFetch("/api/roles");
        const rows = reg.roles.map((r) => `<tr><td><b>${esc(t(`role.${r.key}`))}</b><br><span class="muted small">${esc(t(`role.${r.key}.description`))}</span></td>
          <td>${esc(t(`module.${r.module}`))}</td><td>${esc(t(`login.${r.login}`))}</td><td>${esc(t(`jurisdiction.${r.jurisdiction}`))}</td>
          <td>${r.built ? `<span class="badge ok">${esc(t("status.built"))}</span>` : `<span class="badge">${esc(t("status.coming"))}</span>`}</td></tr>`).join("");
        document.getElementById("roleTable").innerHTML = `<table><tr><th>${esc(t("col.role"))}</th><th>${esc(t("col.module"))}</th>
          <th>${esc(t("col.login"))}</th><th>${esc(t("col.jurisdiction"))}</th><th>${esc(t("col.status"))}</th></tr>${rows}</table>`;
        document.getElementById("comingNext").innerHTML = reg.roles.filter((r) => !r.built).map((r) => `
          <a class="role soon" href="${r.home ? esc(r.home) : `stub.html?role=${encodeURIComponent(r.key)}`}">
            <h3>${esc(t(`role.${r.key}`))}</h3><p>${esc(t(`role.${r.key}.description`))}</p>
            <div class="foot"><span class="badge">${esc(t(`module.${r.module}`))}</span><span class="go">${esc(t(r.home ? "admin.open" : "admin.preview"))}</span></div></a>`).join("");
      } catch (err) {
        document.getElementById("roleTable").innerHTML = `<p class="warn">${esc(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>

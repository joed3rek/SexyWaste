<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waste Generator Map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app">
  <nav id="appNav"></nav>
  <aside id="panel">
    <header class="panel-head">
      <p class="eyebrow">HSR Layout · Sectors 1–7</p>
      <h1 id="title">Waste Generator Map</h1>
      <p id="status" class="hint status">Loading…</p>
    </header>

    <section>
      <h2>Map view</h2>
      <label>Colour buildings by
        <select id="colourBy"></select>
      </label>
      <div class="row" id="quantityControls" hidden>
        <label>Stream
          <select id="stream">
            <option value="kg_day">All streams</option>
            <option value="wet">Wet waste</option>
            <option value="dry">Dry waste</option>
            <option value="sanitary">Sanitary waste</option>
            <option value="special">Special care waste</option>
          </select>
        </label>
        <label>Fraction <select id="fraction" disabled><option value="">All</option></select></label>
      </div>
      <div class="row">
        <label>Sector <select id="sector"><option value="">All sectors</option></select></label>
        <label>Find <input id="search" placeholder="House no. or name" /></label>
      </div>
      <div id="searchResults" class="results"></div>
      <label class="check"><input type="checkbox" id="filterFocus" /> <span id="filterFocusLabel"></span></label>
      <label class="check"><input type="checkbox" id="showLanduse" /> Show land use</label>
      <label class="check"><input type="checkbox" id="show3d" /> 3D view (height = floors)</label>
      <div id="legend" class="legend"></div>
    </section>

    <section id="detail" hidden></section>

    <div id="roleSections"></div>

    <p id="assumptions" class="hint small"></p>
    <p class="hint small">Footprints, addresses and land use © OpenStreetMap contributors.</p>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="ui.js"></script>
  <script src="map.js"></script>
</body>
</html>
